spring:
  application:
    name: financial-payment-shred-test
  profiles:
    active: test

  # Test Database Configuration - Will be overridden by TestContainers
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  # JPA Configuration for Tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true
        jdbc:
          batch_size: 20
    show-sql: true
    defer-datasource-initialization: true

  # H2 Console for debugging (only in test)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis Configuration for Tests - Will be overridden by TestContainers
  data:
    redis:
      host: localhost
      port: 6370
      timeout: 10s
      jedis:
        pool:
          max-active: 2
          max-idle: 2
          min-idle: 0

  # Kafka Configuration for Tests - Will be overridden by TestContainers
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 0
    consumer:
      group-id: financial-payment-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

# Server Configuration for Tests
server:
  port: 0  # Random port for tests
  servlet:
    context-path: /api/v1

# Financial Service Configuration for Tests
financial:
  payment-gateway:
    url: http://localhost:8090/mock-payment
    api-key: test-api-key
    timeout: 5s
  currency-service:
    url: http://localhost:8091/mock-currency
    timeout: 5s
  cache:
    ttl-seconds: 60  # Shorter TTL for tests
  kafka:
    topic-name: financial-events-test

# Logging Configuration for Tests
logging:
  level:
    root: WARN
    ai.shreds: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.testcontainers: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints disabled for tests
management:
  endpoints:
    web:
      exposure:
        include: health

# Resilience4j Circuit Breaker for Tests
resilience4j:
  circuitbreaker:
    instances:
      payment-gateway:
        register-health-indicator: false
        sliding-window-size: 5
        minimum-number-of-calls: 2
        permitted-number-of-calls-in-half-open-state: 1
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
      currency-service:
        register-health-indicator: false
        sliding-window-size: 5
        minimum-number-of-calls: 2
        permitted-number-of-calls-in-half-open-state: 1
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50

# Test specific configurations
test:
  containers:
    postgresql:
      image: postgres:15
      database: financial_test_db
      username: test_user
      password: test_password
    redis:
      image: redis:7-alpine
    kafka:
      image: confluentinc/cp-kafka:7.5.0
