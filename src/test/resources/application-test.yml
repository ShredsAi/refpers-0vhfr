server:
  port: 0

spring:
  application:
    name: authentication-shred-test
  
  datasource:
    url: jdbc:postgresql://localhost:5432/test_auth_db
    username: test_user
    password: test_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
    show-sql: true
  
  redis:
    url: redis://localhost:6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 4
        max-idle: 4
        min-idle: 0
  
  mail:
    host: localhost
    port: 1025
    username: test@example.com
    password: testpassword
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

oauth2:
  authorization:
    server:
      issuer: http://localhost:8080
      client:
        registration:
          default:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-types:
              - authorization_code
              - refresh_token
            redirect-uris:
              - http://localhost:3000/callback
            scopes:
              - read
              - write

jwt:
  secret: test-secret-key-here-must-be-at-least-256-bits-long-for-hs256-algorithm-testing
  expiration: 3600000
  refresh-token:
    expiration: 86400000

mfa:
  sms:
    gateway-url: http://localhost:8080/mock-sms
    api-key: test-api-key

security:
  lockout:
    max-attempts: 5
    lockout-duration-minutes: 15
    exponential-backoff: true
  
  mfa:
    code-expiration-minutes: 5
    totp:
      issuer: Authentication Shred Test
      digits: 6
      period: 30

logging:
  level:
    root: INFO
    ai.shreds: DEBUG
    org.springframework: INFO
    org.springframework.boot: INFO
    org.springframework.web: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always