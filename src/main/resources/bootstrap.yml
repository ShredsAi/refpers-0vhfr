spring:
  application:
    name: gateway-security-shred
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 5
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}