# Production environment specific configuration

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
  
  redis:
    cluster:
      nodes: ${REDIS_CLUSTER_NODES}
    password: ${REDIS_PASSWORD}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
  
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${EMAIL_HOST}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Production OAuth2 settings
oauth2:
  authorization:
    server:
      issuer: ${OAUTH2_ISSUER}
      detailed-error-responses: false

# JWT settings for production
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}  # 1 hour

refresh:
  token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:86400000}  # 24 hours

# SMS Gateway configuration
sms:
  gateway:
    url: ${SMS_GATEWAY_URL}
    api-key: ${SMS_API_KEY}
    timeout: 10000
    retry-attempts: 3

# Production security settings
security:
  lockout:
    max-attempts: 5
    lockout-duration-minutes: 15
    exponential-backoff: true
  rate-limiting:
    enabled: true
    requests-per-minute: 60
    burst-capacity: 100

# Production logging configuration
logging:
  level:
    root: ERROR
    ai.shreds: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
  file:
    name: ./logs/authentication-shred.log
    max-size: 100MB
    max-history: 30
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Production actuator settings
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
    info:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Connection pool monitoring
spring:
  jpa:
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
          batch_versioned_data: true